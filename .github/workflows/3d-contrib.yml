name: 3D contribution city
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # GITHUB_TOKEN only sees public work; add a CONTRIB_TOKEN secret (classic PAT, repo + read:user) to count private contributions
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: sed -i 's/<rect x="0" y="0" width="1280" height="850" class="fill-bg">/<rect x="0" y="0" width="1280" height="850" fill="none">/' profile-3d-contrib/*.svg
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Update 3D contribution city" || exit 0
          git push
